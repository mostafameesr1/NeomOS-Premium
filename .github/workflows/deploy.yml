name: Build & Deploy NeomOS-Premium

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # صلاحية كتابة محتوى الريبو
      pages: write      # صلاحية نشر GitHub Pages
      id-token: write   # مطلوب لبعض خطوات الأمان
    steps:
      # 1️⃣ Checkout الكود
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - run: npm install

      # 4️⃣ Build المشروع
      - run: npm run build

      # 5️⃣ نشر على GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true  # ينشئ الفرع gh-pages إذا مش موجود
