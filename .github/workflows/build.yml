name: Build & Deploy NeomOS-Premium

on:
  push:
    branches:
      - main  # الفرع الرئيسي
  workflow_dispatch:

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # خطوات بناء المشروع حسب NeomOS-Premium
      # لو المشروع Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build  # تأكد أن هذا السكربت موجود في package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: github-pages
          path: ./dist  # مجلد البناء الناتج من المشروع

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages   # تصحيح الخطأ المهم
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: github-pages
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          path: ./site
