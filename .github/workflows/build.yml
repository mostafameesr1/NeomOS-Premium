name: Build & Deploy NeomOS-Premium

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # إعداد Node.js إذا المشروع يستخدم Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build  # تأكد أن السكربت موجود في package.json

      # رفع الملفات كبينة للنشر (تم تحديث الإصدار)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./dist  # عدّل حسب مجلد البناء في مشروعك

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          path: ./site
